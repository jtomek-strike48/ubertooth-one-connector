[package]
name = "ubertooth-plugin"
version = "0.0.1"
edition = "2021"
authors = ["Ubertooth One Contributors"]
description = "Plugin system for Ubertooth One"

[dependencies]
# Core dependencies
ubertooth-core = { path = "../core" }
ubertooth-platform = { path = "../platform" }

# Dynamic loading
libloading = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["lib"]
